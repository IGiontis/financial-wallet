<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-label="MyFiWallet">
  <!-- The MyFiWallet mark, as icon-192.png draws it: three green bars rising
       on a deep navy tile, a near-white trend line over them. It carries its
       own dark tile, so it reads the same on a light or a dark browser tab. -->
  <rect width="192" height="192" rx="32" fill="#1a1a2e"/>
  <g fill="#10b981">
    <rect x="35" y="102" width="34" height="56" rx="8"/>
    <rect x="79" y="67" width="34" height="91" rx="8"/>
    <rect x="123" y="90" width="34" height="68" rx="8"/>
  </g>
  <g fill="none" stroke="#f4f6fb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="36,101 84,69 112,60 154,38"/>
    <polyline points="142,36 156,37 150,49"/>
  </g>
</svg>
